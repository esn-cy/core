services:
  logger.channel.omnia:
    parent: logger.channel_base
    arguments: [ 'omnia' ]

  omnia.file_service:
    class: Drupal\omnia\Service\FileServiceBase
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@file.repository'
      - '@file.usage'
      - '@stream_wrapper_manager'
      - '@logger.factory'

  omnia.email_service:
    class: Drupal\omnia\Service\EmailService
    arguments:
      - '@config.factory'
      - '@plugin.manager.mail'
      - '@renderer'
      - '@logger.factory'

  omnia.stripe_service:
    class: Drupal\omnia\Service\StripeServiceBase
    arguments:
      - '@config.factory'
      - '@logger.factory'

  omnia.google_service:
    class: Drupal\omnia\Service\GoogleServiceBase
    arguments:
      - '@config.factory'
      - '@omnia.file_service'
      - '@logger.factory'

  omnia.apple_service:
    class: Drupal\omnia\Service\AppleWalletServiceBase
    arguments:
      - '@omnia.file_service'
      - '@http_client'
      - '@logger.factory'